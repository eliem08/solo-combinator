[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-combinator"
version = "0.1.0"
description = "Y Combinator for one-person companies: back solo founders running a team of agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "eliem08" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
solo-combinator = "solo_combinator.__main__:main"

[project.urls]
Repository = "https://github.com/eliem08/solo-combinator"

[tool.setuptools]
packages = ["solo_combinator"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I", "SIM", "RUF"]
ignore = ["E501", "E741", "SIM108", "RUF001", "RUF002", "RUF003", "RUF022", "B905"]  # E501: ruff format owns line length

[tool.ruff.lint.per-file-ignores]
"solo_combinator/__init__.py" = ["F401", "F403"]
"tests/*" = ["E501"]
