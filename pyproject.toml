[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solo-combinator"
version = "0.1.0"
description = "Y Combinator for one-person companies: back solo founders running a team of agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
solo-combinator = "solo_combinator.__main__:main"

[tool.setuptools]
packages = ["solo_combinator"]
